<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Icebreaker Bingo</title>

<!-- Confetti library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f5f5f5;
    }

    h1 {
        margin-top: 20px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        width: 90%;
        max-width: 800px;
        margin: 20px auto;
    }

    .cell {
        background: white;
        border: 2px solid #ccc;
        padding: 20px;
        cursor: pointer;
        border-radius: 10px;
        transition: 0.3s;
        font-size: 14px;
    }

    .cell.checked {
        background: purple;
        color: white;
        border-color: purple;
    }
</style>
</head>

<body>

<h1>  💓 محبة لا تغيب 💓 </h1>
<p>ابحث عن شخص يحقق المطلوب </p>

<div class="grid" id="bingoGrid"></div>

<script>
const questions = [
    "شخص لابس أسود واسأليه عن آخر كتاب قرأه",
    "دوري على شخص جرب طريقة ساعدته يحافظ على ورد القرآن يوميًا",
    "شخص يحب الطبخ، واطلبي منه وصفة يتقنها",
    "اسألي الشخص اللي أمامك: ما أكثر شيء شدّك في برنامج نادي ديم هذه السنة؟",
    "شخص لابس ساعة واسأليه عن أفضل طريقة يستثمر فيها وقته",
    "دوري على واحدة جديدة في ديم وشاركيها تجربة جميلة عشتِها في النادي",
    "شخص يستخدم الذكاء الاصطناعي بكثرة",
    "اسألي شخصًا: ما القيمة التي تتمنين أن تبقى راسخة في ديم مهما مرت السنوات؟",
    "قولي لإحدى الخالات الحبيبات: أحبك",
    "شخص تعلّم مهارة جديدة خلال السنة الماضية",
    "دوري على شخص عنده دعاء يردده دائمًا واطلبي منه يشاركك إياه",
    "شخص اسمه يبدأ بنفس أول حرف من اسمك، واسأليه عن معنى اسمه",
    "اسألي شخصًا: ما الموقف الذي شعرتِ فيه بمعنى الأخوة في ديم؟",
    "شخص يتابع بودكاست، واطلبي منه ترشيح حلقة تستحق الاستماع",
    "شخص لابس أبيض واسأليه عن عادة جميلة حسّنت جودة يومه",
    "اسألي شخصًا عن عادة إيمانية غيّرت في يومه",
    "شخص عنده أكثر من ثلاث هوايات",
    "شخص تحبين صحبته واذكري له صفة تتمنين اكتسابها منه",
    "شخص قرأ كتابًا مؤخرًا واسأليه عن أهم فكرة خرج بها",
    "اسألي شخصًا: كيف أثر نادي ديم في حياتك؟",
    "شخص يجيد لغة غير العربية، واطلبي منه يعلمك كلمة جديدة",
    "شخص ابتعد عن مواقع التواصل الاجتماعي لفترة واسأليه عن تجربته",
    "اذكري لشخص موقفًا جميلًا تتذكرينه له",
    "شخص تعرفينه من زمان واذكري له ذكرى جميلة بينكم",
    "شخص تعلّم تفسير سورة مؤخرًا، واطلبي منه مشاركة فائدة منها"

];

const grid = document.getElementById("bingoGrid");

questions.forEach(q => {
    const cell = document.createElement("div");
    cell.classList.add("cell");
    cell.innerText = q;

    cell.addEventListener("click", () => {
        cell.classList.toggle("checked");
        checkBingo();
    });

    grid.appendChild(cell);
});

function launchConfetti() {
    const duration = 2 * 1000;
    const end = Date.now() + duration;

    (function frame() {
        confetti({
            particleCount: 6,
            spread: 70,
            origin: { y: 0.6 }
        });

        if (Date.now() < end) {
            requestAnimationFrame(frame);
        }
    })();
}

// ✅ NEW WIN LOGIC
let hasWon = false;

function checkBingo() {
    const cells = document.querySelectorAll(".cell");
    const checkedCount = Array.from(cells)
        .filter(c => c.classList.contains("checked")).length;

    if (checkedCount >= 16 && !hasWon) {
        hasWon = true;
        alert("💓تم تبادل المرجان بنجاح");
        launchConfetti();
    }
}
</script>

</body>
</html>
